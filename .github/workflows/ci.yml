name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · rustdoc · 100% per-line coverage · path-dep gate.
  #
  # The old `coverage` job enforced 100% per-line over `--workspace` via
  # .github/check-coverage.py, exempting `// cov:unreachable` — exactly the
  # shared workflow's default gate, so `coverage-gate` is left alone. MSRV is
  # read from rust-version (1.96); the old workflow had no MSRV job at all, so
  # this is added by adoption rather than carried.
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@a62ab10603151071744cec0b4e3638aa6406d4e4
    with:
      # Carried across: NO job in the old workflow passed --all-features. Every
      # one of them (`cargo clippy --workspace --all-targets`,
      # `cargo test --workspace`, `cargo llvm-cov --workspace`) built the
      # default feature set only. This crate gates its per-OS trash
      # implementations behind features — `default = ["windows", "linux",
      # "macos", "android", "ios"]` with 12 non-default features besides — so
      # inheriting `all-features: true` would newly compile, test and gate code
      # paths that have never been in scope. That is a scope expansion an
      # adoption PR has no mandate to make.
      all-features: false
      # Carried across: the old gate matched a BARE `cov:unreachable` substring,
      # and 2 of this repo's 16 markers carry no reason. The shared workflow
      # defaults to requiring `// cov:unreachable: <invariant>`, which would
      # fail those two lines — a stricter gate arriving as a side effect of
      # adoption. Tightening this is worth doing, but as its own reviewed change
      # against the 2 markers, not here.
      require-exemption-reason: false
